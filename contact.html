    <main class="container">
        <section>
            <div class="page-header reveal">
                <h2>Get In Touch</h2>
            </div>
            
            <div class="contact-container reveal">
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p><i class="fas fa-envelope" style="color: var(--accent-color)"></i> monikamonikasgowda@gmail.com</p>
                    <p><i class="fas fa-phone" style="color: var(--accent-color)"></i> +91 6360601782</p>
                    <p><i class="fas fa-location-dot" style="color: var(--accent-color)"></i> Govinakere, Channarayapatna Tq., Hassan Dist.</p>
                    
                    <div style="margin-top: 2rem;">
                        <h3>Follow Me</h3>
                        <div style="display: flex; gap: 1.5rem; font-size: 1.5rem; margin-top: 1rem;">
                            <a href="#" style="color: var(--accent-color)"><i class="fab fa-linkedin"></i></a>

                        </div>
                    </div>
                </div>

                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <textarea rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
